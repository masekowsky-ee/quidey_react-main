<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quidey-logo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- installable app (PWA): manifest here, service worker from pwa.js -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quidey" />
    <!-- not black-translucent: its white status text would be unreadable in the light theme -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Planer für Lernen und Studium: Aufgaben, Fokus-Timer, Kalender und gemeinsames Lernen." />
    <!-- search engines find Quidey on its landing page (quidey.com, repo quidey_landing), not here -->
    <meta name="robots" content="noindex" />
    <!-- viewport-fit=cover: the page reaches under an iPhone's notch and home indicator, and
         env(safe-area-inset-*) in the CSS keeps the content clear of them -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- color of the mobile browser's bars; the app updates it with the theme -->
    <meta name="theme-color" content="#2b2b2b" />
    <title>Quidey</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
