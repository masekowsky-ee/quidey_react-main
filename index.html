<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_io//android-chrome-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quidey_react</title>
    <script>
      // Sets the saved theme before the first paint, so light mode doesn't flash dark on load.
      // Same rules as src/features/settings/theme.js.
      try {
        var theme = localStorage.getItem('theme');
        var light = theme === 'light' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
