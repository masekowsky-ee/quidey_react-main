<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quidey-logo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- installable app (PWA): manifest here, service worker from pwa.js -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quidey" />
    <!-- not black-translucent: its white status text would be unreadable in the light theme -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Planer für Lernen und Studium: Aufgaben, Fokus-Timer, Kalender und gemeinsames Lernen." />
    <!-- search engines find Quidey on its landing page (quidey.com, repo quidey_landing), not here -->
    <meta name="robots" content="noindex" />
    <!-- viewport-fit=cover: the page reaches under an iPhone's notch and home indicator, and
         env(safe-area-inset-*) in the CSS keeps the content clear of them -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- color of the mobile browser's bars; the app updates it with the theme -->
    <meta name="theme-color" content="#2b2b2b" />
    <title>Quidey</title>
    <script src="/theme-init.js"></script>
    <!-- the first paint: the theme's ground and a skeleton of what comes, before the app's code -->
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <div id="root">
      <!-- shown until React replaces it (see public/boot.css; classes only, the CSP forbids style attributes) -->
      <div class="boot" aria-busy="true" aria-label="Quidey">
        <div class="boot-app">
          <div class="boot-header">
            <span class="boot-brand"><span class="b r logo"></span><span class="b word"></span></span>
            <span class="boot-nav"><span class="b n1"></span><span class="b n2"></span><span class="b n3"></span><span class="b n4"></span><span class="b n5"></span><span class="b n6"></span></span>
            <span class="boot-end"><span class="b r hi"></span><span class="b r hi"></span><span class="b p newb"></span></span>
          </div>
          <div class="boot-home">
            <div class="boot-title">
              <div class="boot-stack"><span class="b g1"></span><span class="b g2"></span><span class="b t2"></span></div>
              <span class="b p sw"></span>
            </div>
            <div class="boot-columns">
              <div class="boot-main">
                <div class="card boot-sheet"></div>
                <div class="boot-chips"><span class="b p c1"></span><span class="b p c2"></span><span class="b p c3"></span></div>
                <div class="card boot-list"></div>
              </div>
              <div class="boot-aside"><div class="card"></div><div class="card"></div><div class="card"></div></div>
            </div>
          </div>
          <div class="boot-page">
            <span class="b pt"></span>
            <div class="card"></div>
            <div class="card"></div>
          </div>
          <div class="boot-tabs">
            <div class="boot-tab"><span class="b ti"></span><span class="b tl tl1"></span></div>
            <div class="boot-tab"><span class="b ti"></span><span class="b tl tl2"></span></div>
            <div class="boot-tab"><span class="b ti"></span><span class="b tl tl3"></span></div>
            <div class="boot-tab"><span class="b ti"></span><span class="b tl tl2"></span></div>
            <div class="boot-tab"><span class="b ti"></span><span class="b tl tl1"></span></div>
          </div>
        </div>
        <div class="boot-gate">
          <div class="boot-gate-head"><span class="boot-brand"><span class="b r logo"></span><span class="b word"></span></span><span class="b about"></span></div>
          <div class="card"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
